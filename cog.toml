from_latest_tag = true
ignore_merge_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
post_package_bump_hooks = []
tag_prefix = "v"

# Keep the crate version on the tag, and Cargo.lock in step with it.
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/wska/Cargo.toml",
    "cargo update -p wska --offline",
]

# cog's tag is lightweight, which `git push --follow-tags` skips: push the bump
# commit and its tag together so the v* tag triggers the release workflow.
post_bump_hooks = [
    "git push --atomic origin HEAD v{{version}}",
]


[git_hooks]

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""

[git_hooks.pre-commit]
script = """#!/bin/sh
set -e
task recu
git add -u # in case recu needed to regenerate files, add need to be done before linting (-u: tracked files only)
task lint
git add -u # in case linting fixed anything
.hooks/end-of-line.sh
.hooks/whitespace-fixer.sh
gitleaks git --pre-commit --redact --staged --verbose
"""

[commit_types]
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "weebo-skillsagent"
owner = "batleforc"

[bump_profiles]

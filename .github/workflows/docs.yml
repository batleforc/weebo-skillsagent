name: docs

# Builds the Fumadocs site in docs/ (themed by @weebo/operator-docs) as a
# static export and publishes it to GitHub Pages.
# Pages source: "GitHub Actions" (build_type=workflow).
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml", ".tasks/docs.yaml"]
  workflow_dispatch:

permissions: {}

# One deployment at a time; never cancel one in flight, so Pages is never
# left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # configure-pages reads the Pages site config (base_path, origin).
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: task node
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the static site
        env:
          # A project site is served under /<repo>; base_path is exactly that.
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DOCS_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: task docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

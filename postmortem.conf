# postmortem supply-chain gate, read by `task audit` and .github/workflows/audit.yml.
# Reference: https://github.com/mlab-sh/postmortem/wiki/CI-Gate

[gate]
max_high = 0
fail_on_vuln = "high"

# Both come in through clap -> anstream and live in polyfill-rs, run by clap's
# maintainer. Flagged only for low star counts, not for anything they contain.
[[gate.allow]]
package = "is_terminal_polyfill"
reason  = "clap transitive dep (anstream); low-stars only"
expires = "2027-04-16"

[[gate.allow]]
package = "once_cell_polyfill"
reason  = "clap transitive dep (anstream); low-stars only"
expires = "2027-04-16"

# Gitignored local state, absent from a CI checkout: upstream clones made by
# `wska sync` (their release scripts trip the worm heuristics) and judge's venv.
[[ignore]]
path   = "**/.task/**"
reason = "gitignored wska/task cache"

[[ignore]]
path   = "**/.venv/**"
reason = "gitignored python virtualenv"

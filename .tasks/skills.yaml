version: "3"

vars:
  WSKA: '{{.WSKA | default "cargo run --quiet -p wska --"}}'
  SCOPE: '{{.SCOPE | default "project"}}'

tasks:
  build:
    desc: "Build the wska binary"
    cmds:
      - cargo build --release -p wska

  install:
    desc: "Link profiles and single items into a target, recorded in its .claude/wska.toml; with neither, re-apply that file (usage: task skills:install [PROFILE=base,planning] [ITEM=weebo-techdoc] [SCOPE=project|user] [RUN_INSTALLERS=0])"
    vars:
      # Installers (bmad, graphify) write project-coupled state that cannot be
      # symlinked, so skipping them leaves those items installed nowhere.
      # RUN_INSTALLERS=0 opts out when you only want the links.
      RUN_INSTALLERS: '{{.RUN_INSTALLERS | default "1"}}'
    cmds:
      - '{{.WSKA}} install{{if .PROFILE}}{{range splitList "," .PROFILE}} --profile {{.}}{{end}}{{end}}{{if .ITEM}}{{range splitList "," .ITEM}} --item {{.}}{{end}}{{end}} --scope {{.SCOPE}} {{if ne .RUN_INSTALLERS "0"}}--run-installers{{end}}'

  update:
    desc: "Pull the items repo, then re-install the given profiles/items, else the target's .claude/wska.toml if any (usage: task skills:update [PROFILE=base,planning] [ITEM=weebo-techdoc] [SCOPE=project|user] [RUN_INSTALLERS=0])"
    vars:
      RUN_INSTALLERS: '{{.RUN_INSTALLERS | default "1"}}'
    cmds:
      - '{{.WSKA}} update{{if .PROFILE}}{{range splitList "," .PROFILE}} --profile {{.}}{{end}}{{end}}{{if .ITEM}}{{range splitList "," .ITEM}} --item {{.}}{{end}}{{end}} --scope {{.SCOPE}} {{if ne .RUN_INSTALLERS "0"}}--run-installers{{end}}'

  status:
    desc: "Show what is linked in a target (usage: task skills:status [SCOPE=project|user])"
    cmds:
      - '{{.WSKA}} status --scope {{.SCOPE}}'

  list:
    desc: "List the items in this repo (usage: task skills:list [PROFILES=1])"
    cmds:
      - '{{.WSKA}} list {{if .PROFILES}}--profiles{{end}}'

  doctor:
    desc: "Check every item can work here: required tools on PATH and a usable SKILL.md"
    cmds:
      - '{{.WSKA}} doctor'

  sync:
    desc: "Refresh vendored sources from upstream (usage: task skills:sync [SOURCE=impeccable])"
    cmds:
      - '{{.WSKA}} sync {{.SOURCE}}'

  sync:check:
    desc: "Report vendored drift, patched skills and missing licences without writing (exit 2 = behind upstream, 1 = no licence)"
    cmds:
      - '{{.WSKA}} sync --check'

  test:
    desc: "Run the wska test suite"
    cmds:
      - cargo test -p wska

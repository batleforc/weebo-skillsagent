# source: batlehub@20879e5 (.github/workflows/build.yaml), trimmed: one image
# instead of three, no VEX document. Every job uploads to the same DRAFT
# release; a person reads it and publishes it by hand.
name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_NAMESPACE: oci://ghcr.io/${{ github.repository }}/charts
jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          tag_name="${GITHUB_REF_NAME}"
          version="${tag_name#v}"
          echo "tag=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
  server:
    name: Build and publish server binary
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signing + attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked -p my-server
      # CycloneDX SBOM of the Rust workspace: lets a future-disclosed crate CVE
      # be matched against this exact shipped build (`trivy sbom sbom-rust.cdx.json`).
      - name: Generate Rust SBOM (CycloneDX)
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx
          # cargo-cyclonedx writes one <crate>.cdx.json per workspace member next
          # to its manifest; keep only the server's, for the release upload below.
          cargo cyclonedx --format json --manifest-path server/Cargo.toml
          cp server/my-server.cdx.json sbom-rust.cdx.json
          find . -maxdepth 3 -name '*.cdx.json' -not -path './sbom-rust.cdx.json' -delete
      # Provenance answers "which workflow, from which commit, built this?"
      # (`gh attestation verify`, no key to distribute). The detached signature
      # in the `sign` job answers "is this the file that release published?"
      # for someone who has the file and not the GitHub API. Keyless
      # throughout: the identity is this workflow's OIDC token.
      - name: Attest the binary's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/release/my-server
      # The SBOM is bound to the binary, not merely uploaded beside it: the
      # attestation names the binary's digest as its subject.
      - name: Attest the binary's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: target/release/my-server
          sbom-path: sbom-rust.cdx.json
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "my-server ${{ needs.meta.outputs.tag }}"
          draft: true
          body: |
            ### What's in the box
            - **Server binary**: `my-server` (Linux x86_64)
            - **CLI**: Linux (amd64/arm64), Windows, macOS
            - **Container image**: `ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.version }}`
            - **Helm chart**: `${{ env.CHART_NAMESPACE }}`
            - **SBOMs** (CycloneDX) attached and attested
            - **`checksums.txt`** + a Sigstore bundle covering every asset here

            ### Verify it
            ```bash
            cosign verify \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.version }}
            cosign verify-blob --bundle checksums.txt.sigstore.json \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              checksums.txt
            sha256sum -c checksums.txt
            gh attestation verify my-server --repo ${{ github.repository }}
            ```

            #### Changes
          generate_release_notes: true
          files: |
            target/release/my-server
            sbom-rust.cdx.json
          fail_on_unmatched_files: true
  cli:
    name: CLI — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: meta
    permissions:
      contents: write
      packages: write
      id-token: write # keyless attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: my-cli
            archive: my-cli-linux-amd64.tar.gz
            use_cross: true
            windows: false
          - name: Linux aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: my-cli
            archive: my-cli-linux-arm64.tar.gz
            use_cross: true
            windows: false
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: my-cli.exe
            archive: my-cli-windows-amd64.zip
            use_cross: false
            windows: true
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: my-cli
            archive: my-cli-darwin-arm64.tar.gz
            use_cross: false
            windows: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "stable"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cross
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked -p my-cli --target ${{ matrix.target }}
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --locked -p my-cli --target ${{ matrix.target }}
      - name: Stage artifact (Unix)
        if: "!matrix.windows"
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" my-cli
          tar czf "${{ matrix.archive }}" my-cli
      - name: Stage artifact (Windows)
        if: matrix.windows
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" my-cli.exe
          Compress-Archive -Path my-cli.exe -DestinationPath "${{ matrix.archive }}"
      # Per-target, because each runner builds its own archive and only that
      # runner ever holds the bytes.
      - name: Attest the archive's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "my-server ${{ needs.meta.outputs.tag }}"
          draft: true
          files: ${{ matrix.archive }}
          fail_on_unmatched_files: true
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
      packages: write
      security-events: write # upload Trivy SARIF
      id-token: write # SBOM / provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # By digest, never by tag: a tag is a mutable pointer, so signing `:1.2.3`
      # would sign whatever that name resolves to at verification time. `--yes`
      # because there is no console to confirm on. A signature says "this
      # workflow published this"; the attestations below carry documents (SBOM)
      # bound to the same digest. Both are wanted.
      - name: Sign the image
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-image
      - name: Generate image SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json
      # `push-to-registry: true` makes the attestation an OCI referrer of the
      # image digest, so it travels with the image through any registry.
      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attach the SBOM to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "my-server ${{ needs.meta.outputs.tag }}"
          draft: true
          files: sbom-image.cdx.json
      # Final gate: fail the release run on any fixable HIGH/CRITICAL CVE.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signing of the pushed chart
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        shell: bash
        run: |
          helm dependency build helm/my-server
          mkdir -p dist
          helm package helm/my-server \
            --destination dist \
            --version "${{ needs.meta.outputs.version }}" \
            --app-version "${{ needs.meta.outputs.version }}"
      # The digest comes out of `helm push`, which prints it to **stderr**. A
      # chart in an OCI registry is an image as far as cosign is concerned.
      - name: Push chart to GHCR and sign it
        shell: bash
        run: |
          set -euo pipefail
          helm push "dist/my-server-${{ needs.meta.outputs.version }}.tgz" "${CHART_NAMESPACE}" 2>&1 \
            | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -n1)
          if [ -z "${digest}" ]; then
            echo "helm push printed no digest — refusing to sign a tag" >&2
            exit 1
          fi
          repo="${CHART_NAMESPACE#oci://}/my-server"
          echo "Signing ${repo}@${digest}"
          cosign sign --yes "${repo}@${digest}"

  # One file that covers every release asset: `checksums.txt` plus a detached
  # Sigstore bundle, so a mirror or an air-gapped importer can verify a download
  # with `cosign verify-blob` and `sha256sum -c`, no GitHub API call. Last, and
  # needing every other job: it can only list assets that exist. The perf
  # report is deliberately not covered (it is attached later by its own run).
  sign:
    name: Checksums and detached signature
    runs-on: ubuntu-latest
    needs: [meta, server, cli, image, chart]
    permissions:
      contents: write
      id-token: write # keyless signing
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # The release is still a draft, which `gh release download` resolves
          # by tag for a token that can see it.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          ls -la assets
      - name: Checksum and sign
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          # Sorted, so the file is byte-identical whatever the download order,
          # and without the checksum files themselves, which a re-run would
          # otherwise have downloaded from the previous attempt.
          sha256sum $(ls | grep -v '^checksums\.txt' | sort) > ../checksums.txt
          cd ..
          cat checksums.txt
          # `--bundle` writes signature, certificate and transparency-log entry
          # as one file; verifying needs that file and nothing else.
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt
      - name: Attach them to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: "my-server ${{ needs.meta.outputs.tag }}"
          draft: true
          files: |
            checksums.txt
            checksums.txt.sigstore.json
          fail_on_unmatched_files: true

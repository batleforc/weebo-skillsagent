# source: batlehub@20879e5 (.github/workflows/image-scan.yaml), trimmed to the proxy image.
# What the gate checks and how findings are suppressed belongs to weebo-security.
name: Container image scan
on:
  push:
    branches: ["main"]
    paths:
      - "Containerfile"
      - "Cargo.lock"
      - "ui/pnpm-lock.yaml"
      - ".trivyignore.yaml"
      - ".github/workflows/image-scan.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "Containerfile"
      - "Cargo.lock"
      - "ui/pnpm-lock.yaml"
      - ".trivyignore.yaml"
      - ".github/workflows/image-scan.yaml"
  # Daily rebuild + rescan so a CVE disclosed against a base/OS layer AFTER the
  # last build still trips CI — this is the "future CVE" detection, not just a
  # build-time snapshot.
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Build & Trivy scan (Containerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          load: true
          push: false
          tags: my-server:scan
          # Distinct scopes: the default one is shared, so two image builds in
          # the same repo otherwise overwrite each other's cache manifest.
          cache-from: type=gha,scope=my-server
          cache-to: type=gha,mode=max,scope=my-server
      # Produce SARIF for the Security tab (does not fail the build).
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: my-server:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-containerfile
      # The gate: fail the job on any fixable HIGH/CRITICAL OS or library CVE.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: my-server:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

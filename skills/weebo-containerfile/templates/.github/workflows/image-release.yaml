# source: batlehub@20879e5 (.github/workflows/build.yaml, `meta` + `image` jobs), trimmed to one image.
# In batlehub these are two jobs of the tag-triggered Release workflow (weebo-release
# owns the rest of it: binaries, chart, checksums). The SBOM, VEX and scan
# policy behind the attest/scan steps belong to weebo-security.
name: Release image
on:
  push:
    tags:
      - "*"
permissions:
  contents: read
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write
      security-events: write # upload Trivy SARIF
      id-token: write # keyless signing, SBOM / provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # QEMU builds arm64 emulated on an amd64 runner. It works, but it is the
      # main reason batlehub's image step takes hours (TD-0003 §1).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Keyless: cosign takes this job's OIDC token as the signing identity and
      # records the signature in the Sigstore transparency log. No key material
      # exists to be stolen, and `cosign verify` checks the *identity* — this
      # workflow, at this tag — rather than a fingerprint someone has to trust.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.version }}
          # Provenance comes from attest-build-provenance below instead.
          provenance: false
          cache-from: type=gha,scope=my-server
          cache-to: type=gha,mode=max,scope=my-server
      # By digest, never by tag: a tag is a mutable pointer, so signing
      # `:1.2.3` would sign whatever that name resolves to at verification
      # time. `--yes` because there is no console to confirm on.
      - name: Sign the image
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      # Scan the published image. Prevention happens earlier (image-scan.yaml on
      # PRs + the daily rebuild-and-scan); this is the release backstop and feeds
      # the Security tab.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-release-image
      # `push-to-registry: true` binds the attestation to the image: it becomes
      # an OCI referrer of the digest and travels with the image.
      - name: Generate image SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json
      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Final gate — fail the release run on any fixable HIGH/CRITICAL CVE.
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

# source: batlehub@20879e5 (deny.toml), trimmed.
# cargo-deny configuration — supply-chain gate for the Rust workspace.
#
# Complements `cargo audit` (RUSTSEC advisories only) with:
#   • advisories — vulnerabilities + unmaintained + yanked crates
#   • bans       — assert deliberately-removed crates never re-enter the tree
#   • licenses   — flag a future copyleft transitive dependency
#   • sources    — only crates.io (+ in-repo path patches) are trusted
#
# Run locally with `task deny`. CI gates on it in back-dep-audit.yaml.

[graph]
# all-features keeps optional adapters in the graph. No `targets` filter: if a
# binary is released for Windows/macOS, restricting to Linux would also stop
# advisories being reported for the artefact those users download.
all-features = true

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked crates are treated as a failure — a yank usually means "do not use".
yanked = "deny"
# Mirror the "no suppressions" stance of .cargo/audit.toml: nothing ignored.
# If an entry ever lands here it carries the advisory id, why it does not apply,
# who checked, the date, and the upstream issue that will retire it.
ignore = []

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Every duplicate is checked and accounted for in `skip`; one this list does not
# know fails the build.
#
# ── Security outranks tidiness, and the config enforces it ────────────────────
#
#   1. An advisory is never resolved by keeping an old line for tidiness, and a
#      duplicate is never resolved by downgrading. If upgrading a crate to close
#      a RUSTSEC advisory creates a duplicate, **the upgrade stands and the skip
#      is added in the same commit.**
#   2. `skip` is for de-duplication only. It has no power over `deny` below —
#      cargo-deny refuses to load this file if a crate appears in both, so the
#      vulnerable lines named there cannot be silenced by adding them here.
#   3. Only then: before adding a `skip`, name who holds the old version and
#      check whether it can simply be upgraded away.
multiple-versions = "deny"

# One entry per duplicate, each with the crate that holds the older line.
# Versions are semver requirements (`0.22` is `^0.22`), so a patch release of a
# holder needs no edit here — only a genuinely new line does.
skip = [
    # Example: { name = "base64", version = "0.22" },  # held by actix-http
]
# Workspace crates depend on each other via versionless `{ path = … }`, which
# cargo-deny counts as wildcards. The security value is `deny`, not this.
wildcards = "allow"
deny = [
    # Crates removed from the tree for a security reason. Denying them turns
    # "removed by a bump/patch/feature flag" into a CI-failing invariant: if a
    # dependency bump silently drags one back in, the build breaks. Each entry
    # names the advisory and how it was removed. Real examples from batlehub:
    #
    # RUSTSEC-2023-0071 (Marvin attack) — pulled in via sqlx-mysql, removed by
    # patching sqlx-mysql out.
    # { name = "rsa" },
    #
    # RUSTSEC-2026-0258 — fixed in h2 0.4.16, no 0.3 backport. Removed by
    # turning off actix-web's `http2` default feature; this stops a future
    # `default-features = true` from quietly reintroducing it.
    # { name = "h2", version = "<0.4" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
# Permissive allowlist. Anything NOT listed (notably GPL/AGPL/LGPL copyleft)
# fails the check, so a future copyleft transitive dependency is surfaced.
# Add an entry with a comment naming the crate that needs it.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots trust store
    "BSL-1.0",
    "Unlicense",
    "MIT-0",
]
confidence-threshold = 0.8

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

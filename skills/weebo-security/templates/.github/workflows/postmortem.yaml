# source: batlehub@20879e5 (.github/workflows/postmortem.yaml), trimmed.
name: Supply chain (postmortem)
# Rebuilds the dependency forest from the committed lockfiles, scores each
# dependency's source repo (reputation, activity, archived/abandoned, identity
# signals), cross-checks known vulnerabilities, uploads SARIF. Complements
# cargo audit / pnpm audit, which only know about *published advisories*.
#
# One job per dependency root (postmortem does not recurse). Separate jobs, not
# a matrix: postmortem stamps every result `artifactLocation.uri = "."`, so the
# uploads differ only by Code Scanning category, which a matrix inside this
# composite action cannot set — matrix legs would supersede each other.
#
# Deliberately **unfiltered** by `paths:`: the verdict depends on data fetched
# live, so an unchanged lockfile can go from clean to "three archived
# upstreams" without a commit.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Daily, same slot as the other dependency audits.
  schedule:
    - cron: "50 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
# Anonymous vuln.mlab.sh allows 8 scans/hour and one run spends one per root.
# Set the VULN_MLAB_TOKEN secret (25/hour); the group absorbs repeated pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  rust:
    name: postmortem — Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      actions: read
      issues: write # create-issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to an untagged main commit that carries `create-issue`; move to
      # the first tag that does. `version` (the scanner binary) matches mise.toml
      # so local and CI gate alike.
      #
      # create-issue: on push/schedule (never on a PR), a tripped gate opens one
      # issue per branch and closes it once the gate passes. It finds the issue
      # by label + branch only, so each blocking job needs its own label.
      #
      # soft-fail is on *by design*: the SARIF upload is the step after the
      # scan, so a hard failure would skip it. The scan reports, the Gate step
      # below fails the job — the same report-then-gate shape as semgrep.yaml.
      - name: postmortem supply-chain scan (Rust)
        id: scan
        uses: mlab-sh/postmortem@f32b60299e0be03bce9238c23399583c7e2c1d48 # main, 2026-10-11 (create-issue)
        with:
          path: "."
          version: v2.5.0
          online: "true" # source-repo reputation (uses github-token below)
          vulns: "true" # known advisories via vuln.mlab.sh
          fail-on-vuln: high
          sarif: "true"
          soft-fail: "true"
          github-token: ${{ github.token }}
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          create-issue: "true"
          issue-label: postmortem-rust
      # exit-code: 0 pass · 1 gate tripped · 2 misconfig / no ecosystem detected.
      # Read through the environment, never interpolated: bare `exit` with an
      # empty argument returns the previous command's status, so a missing
      # output would turn a lost verdict into a silent pass.
      - name: Gate
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
        run: exit "${CODE:-1}"

  ui:
    name: postmortem — UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write # create-issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: postmortem supply-chain scan (UI)
        id: scan
        uses: mlab-sh/postmortem@f32b60299e0be03bce9238c23399583c7e2c1d48 # main, 2026-10-11 (create-issue)
        with:
          path: ui
          version: v2.5.0
          online: "true"
          vulns: "true"
          fail-on-vuln: high
          sarif: "true"
          soft-fail: "true"
          github-token: ${{ github.token }}
          vuln-token: ${{ secrets.VULN_MLAB_TOKEN }}
          create-issue: "true"
          issue-label: postmortem-ui
      - name: Gate
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
        run: exit "${CODE:-1}"

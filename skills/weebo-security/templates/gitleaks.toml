# source: batlehub@20879e5 (gitleaks.toml), trimmed.
# gitleaks configuration — secret scanning gate (see .github/workflows/secret-scan.yaml).
# Local run, identical to CI:  GITLEAKS_CONFIG=$PWD/gitleaks.toml gitleaks git .
#
# Extends the full built-in ruleset; the allowlist below only exempts known
# non-secrets (test key fixtures and documentation examples). Keep it tight — do
# not allowlist whole directories where a real credential could later land.

title = "my-project gitleaks config"

[extend]
useDefault = true

# The allowlist is commented out until its first entry: an [allowlist] with no
# paths and no regexes fails to load ("must contain at least one check").
#
# Prefer `regexes` (matched on the value) over `paths`. The scan walks full
# history, so an inline `gitleaks:allow` fixes the working tree and leaves the
# commit that introduced the line flagged forever, and a path entry has to name
# every path the file has *ever* had. A value entry survives a rename, covers
# the next file carrying the same literal, and still flags a real credential in
# the file it exempts.
#
# [allowlist]
# description = "Test fixtures and documentation examples — no live secrets"
# regexes = [
#     # The perf harness's token, minted against a throwaway local server.
#     '''perf-user-token''',
# ]
# paths = [
#     # `curl -H "Authorization: Bearer <token>"` usage examples in the docs.
#     '''docs/guide/installation\.md''',
# ]

# source: batlehub@20879e5 (devfile.yaml), trimmed.
schemaVersion: 2.3.0
metadata:
  name: my-crate
# The Weebo image: mise, task, kubectl and the editor live in its `tools`
# container. This file only adds to it.
parent:
  uri: https://raw.githubusercontent.com/batleforc/WeeboDevImage/refs/heads/main/che-min-mise/devfile.yaml
  components:
    # Override of the parent's `tools` container: same name, so it is merged,
    # not added. Raise memory for cargo, and publish the dev ports.
    - name: tools
      container:
        memoryLimit: 15Gi
        endpoints:
        - name: front
          targetPort: 5173
          exposure: public
          protocol: https
          secure: true
        - name: back
          targetPort: 8080
          exposure: public
          protocol: https
          secure: true

components:
  # Headed Chrome (Chrome for Testing) behind Xvfb, in a sidecar of this pod.
  # Every container in the pod shares one network namespace, so CDP and
  # chromedriver are plain `localhost` ports from the tools container — and the
  # dev server on 5173 is reachable from Chrome the same way, with no ingress.
  # Chromium in the tools container cannot run (the image has no libglib and
  # there is no root), which is precisely the gap this fills.
  #
  # Upstream: github.com/batleforc/WeeboDevImage/tree/main/che-browser
  - name: browser
    container:
      image: ghcr.io/batleforc/weebodevimage/che-browser:main
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      # Shared so Chrome can open file:///projects/… and so screenshots and
      # reports can be exchanged with the tools container through /projects.
      mountSources: true
      endpoints:
        # Watch or drive the same Chrome the automation drives. The password is
        # in /projects/.sidecar/vnc-password-browser.txt — `task browser:vnc`.
        - name: novnc
          targetPort: 6080
          exposure: public
          protocol: https
          secure: true
        # DevTools Protocol. Internal on purpose: anything that can reach it can
        # drive the browser, and it needs no exposure to be useful from the pod.
        - name: cdp
          targetPort: 9222
          exposure: internal
          protocol: http
        - name: webdriver
          targetPort: 9515
          exposure: internal
          protocol: http
  # A backing service as a sidecar: what `podman compose up -d postgres` is
  # outside the workspace. Databases beyond POSTGRES_DB are made by `task cde:init`.
  - name: postgres
    container:
      image: postgres:17-alpine
      env:
        - name: POSTGRES_DB
          value: my_crate
        - name: POSTGRES_PASSWORD
          value: changeme
        - name: POSTGRES_USER
          value: my_crate
        - name: PGDATA
          value: /data/pgdata
      endpoints:
        - name: port-5432
          targetPort: 5432
          exposure: public
      volumeMounts:
        - name: postgres-data
          path: /data/
      mountSources: true
  # Persistent volume: survives a workspace restart, unlike the container's own
  # filesystem.
  - name: postgres-data
    volume:
      size: 10Gi

# source: batlehub@20879e5 (.github/workflows/helm-lint.yaml), trimmed.
name: Helm chart lint
# Publishing only runs on a tag, so it cannot gate a pull request. This job
# renders the chart on every PR that touches it and asserts the invariants that
# are easy to break silently and expensive to discover in the cluster.
on:
  push:
    branches: ["main"]
    paths:
      - "helm/**"
      - ".github/workflows/helm-lint.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "helm/**"
      - ".github/workflows/helm-lint.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: helm lint + rendered-manifest assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # With a sub-chart dependency, `helm repo add` its repository first:
      # Helm 4 refuses `dependency build` for a repository it has never been
      # told about.
      - name: helm lint
        run: |
          helm dependency build helm/my-server
          helm lint helm/my-server

      - name: Render default values
        run: helm template my-server helm/my-server > /tmp/rendered.yaml

      # Scoped to each probe block on purpose. Two independent global greps both
      # pass when the paths are *swapped* — liveness on /healthz would then
      # restart every replica on a database blip, while the check stayed green.
      - name: Probes must target /livez and /healthz
        run: |
          grep -A3 -E '^[[:space:]]+livenessProbe:' /tmp/rendered.yaml \
            | grep -qE '^[[:space:]]+path: /livez$' \
            || { echo "::error::liveness probe is not /livez"; exit 1; }
          grep -A3 -E '^[[:space:]]+readinessProbe:' /tmp/rendered.yaml \
            | grep -qE '^[[:space:]]+path: /healthz$' \
            || { echo "::error::readiness probe is not /healthz"; exit 1; }

      # The chart is the backstop that keeps the workload off uid 0.
      - name: Pod must be non-root by default
        run: |
          for key in 'runAsNonRoot: true' 'allowPrivilegeEscalation: false' 'readOnlyRootFilesystem: true'; do
            grep -q "$key" /tmp/rendered.yaml || { echo "::error::default values dropped '$key'"; exit 1; }
          done

      # Rendering with a non-default combination catches template errors that
      # the default path never reaches (ingress rules, PDB, network policy).
      - name: Render a non-default configuration
        run: |
          helm template my-server helm/my-server \
            --set replicaCount=3 \
            --set ingress.enabled=true \
            --set 'ingress.extraHosts[0]=*.my-server.example.com' \
            --set networkPolicy.enabled=true \
            > /dev/null

  docs:
    name: chart README matches values.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the commit in mise.toml, not "latest": two builds of
      # helm-docs do not have to agree on the generated table, and a drifting
      # one would fail the gate on a commit that changed nothing. Built from
      # source because the last release (v1.14.2, 2024) carries a Go 1.22
      # toolchain's worth of CVEs.
      - name: Install helm-docs
        env:
          HELM_DOCS_COMMIT: a5573af096a4b526dcbc3c896c220b1714a0765b
        run: |
          set -euo pipefail
          GOBIN=/tmp/bin go install "github.com/norwoodj/helm-docs/cmd/helm-docs@${HELM_DOCS_COMMIT}"
          sudo install -m 0755 /tmp/bin/helm-docs /usr/local/bin/helm-docs

      - name: helm-docs drift
        run: |
          set -euo pipefail
          helm-docs --chart-search-root=helm/my-server --sort-values-order=file
          if ! git diff --exit-code -- helm/my-server/README.md; then
            echo "::error::helm/my-server/README.md is out of date. Run 'task helm:docs' and commit the result."
            exit 1
          fi

{{- /* source: batlehub@20879e5 (helm/batlehub/templates/secret.yaml), trimmed. */ -}}
{{- /* A Secret, not a ConfigMap: config.toml carries tokens and connection strings. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "my-server.fullname" . }}-config
  labels:
    {{- include "my-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.toml: |
    {{- include "my-server.config" . | nindent 4 }}

# source: batlehub@20879e5 (.tasks/mise.yaml) + weebo-skillsagent (.tasks/mise.yaml: install), trimmed.
version: "3"

tasks:
  install:
    desc: "Install every tool pinned in mise.toml"
    cmds:
      - mise install
  lock:gen:
    desc: "Generate mise lock file"
    cmds:
      # Add a platform per OS/arch that runs the project (CI, teammates' laptops).
      - mise lock --platform linux-x64
  lock:update:
    desc: "Upgrade the tools within their pins and refresh the lock file"
    cmds:
      - mise upgrade

# source: batlehub@20879e5 (mise.toml) + weebo-skillsagent (mise.toml), trimmed.
# Every tool the project, its tasks and its hooks call. Nothing is installed by
# hand: `mise search <name>`, then `mise use <name>` writes the line here.
[tools]
task = "latest"
cocogitto = "latest"
rust = "latest"
node = "26"
pnpm = "12"   # package manager for ui/ (settings in pnpm-workspace.yaml + packageManager field)
uv = "latest"
# Pinned, not "latest": the same version is pinned in the CI secret-scan
# workflow, so a local `gitleaks git .` reproduces the gate exactly. A drifting
# `latest` here once flagged a fixture CI's older version did not, and no local
# run could see why the gate failed.
gitleaks = "8.30.1"
# Pin ahead of mise's index when a CVE fix is out but `latest` still resolves
# to the old release; go back to "latest" once the index has caught up.
# go = "1.27.2"

# ── Other backends: `<backend>:<package>` ─────────────────────────────────────
"cargo:cargo-audit" = "latest"            # built from crates.io
"cargo:cargo-sweep" = "latest"            # `task clean:stale`
"aqua:EmbarkStudios/cargo-deny" = "latest" # prebuilt binary, faster than cargo:
"pipx:graphifyy" = "latest"               # Python CLI, installed with uv when present
# A GitHub release. `exe` is required when the binary in the archive is not
# named after the repository (repo `rustfs/cli`, binary `rc`).
"github:rustfs/cli" = { version = "latest", exe = "rc" }

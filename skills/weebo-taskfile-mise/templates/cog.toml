# source: weebo-skillsagent (cog.toml) + batlehub@20879e5 (cog.toml: tag_prefix), trimmed.
# Hooks only. Bump, changelog and release settings belong to the weebo-release
# skill. `task init` writes these into .git/hooks with `cog install-hook -a -o`;
# re-run it after editing a script below.
tag_prefix = "v"

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""

[git_hooks.pre-commit]
script = """#!/bin/sh
set -e
# Re-stage only what the commit already holds plus what `task recu` generated:
# `git add -u` swept every modified tracked file into the commit.
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
git diff --cached --name-only --diff-filter=ACMR > "$tmp/staged"
git diff --name-only | sort > "$tmp/dirty"
# shortcut: a re-staged file takes its unstaged hunks too (`git add -p` is lost), fine until a fixer runs on partially staged files
restage() {
    while IFS= read -r f; do
        if [ -e "$f" ]; then git add -- "$f"; fi
    done < "$tmp/staged"
}
task recu
git diff --name-only | sort | comm -13 "$tmp/dirty" - >> "$tmp/staged"
restage # before linting, so lint sees the regenerated files
task lint
restage # in case linting fixed anything
.hooks/end-of-line.sh
.hooks/whitespace-fixer.sh
gitleaks git --pre-commit --redact --staged --verbose
"""

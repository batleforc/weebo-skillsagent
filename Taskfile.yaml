version: "3"

includes:
  mise: ./.tasks/mise.yaml
  claude: ./.tasks/claude.yaml
  template: ./.tasks/template.yaml
  skills: ./.tasks/skills.yaml
  agent: ./.tasks/agents.yaml

tasks:
  init:
    desc: "Init folder"
    cmds:
      - task mise:install
      - task claude:install
      - cog install-hook -a -o
      - task skills:install PROFILE=all SCOPE=project

  recu:
    desc: "Recuring job like regenerating Swagger spec"
    cmds:
      - echo "nothing to regenerate yet"

  lint:
    desc: "Linting your project to apply good practice"
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets -- -D warnings
      - uvx ruff check judge
      - uvx ruff format --check judge

  release:
    desc: "Bump the version from conventional commits and tag it (usage: task release, then git push --follow-tags to publish binaries)"
    cmds:
      - cog bump --auto

  audit:
    desc: "Check dependencies and Containerfile for CVE"
    cmds:
      - cargo audit
      - task skills:sync:check
      # Python CVEs in judge's locked dependencies; the hashed export lets
      # pip-audit check the exact pins without resolving anything.
      - mkdir -p .task && uv export --project judge --frozen --no-emit-project -o .task/judge-requirements.txt
      - uvx pip-audit --disable-pip -r .task/judge-requirements.txt

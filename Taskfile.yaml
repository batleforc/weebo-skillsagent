version: "3"

includes:
  mise: ./.tasks/mise.yaml
  claude: ./.tasks/claude.yaml
  template: ./.tasks/template.yaml
  skills: ./.tasks/skills.yaml
  agent: ./.tasks/agents.yaml
  techdoc: ./.tasks/techdoc.yaml
  docs: ./.tasks/docs.yaml
  mods: ./.tasks/mods.yaml

tasks:
  init:
    desc: "Init folder"
    cmds:
      - task mise:install
      - task claude:install
      - cog install-hook -a -o
      - task skills:install PROFILE=all SCOPE=project

  recu:
    desc: "Recuring job like regenerating Swagger spec"
    cmds:
      - echo "nothing to regenerate yet"

  lint:
    desc: "Linting your project to apply good practice"
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets -- -D warnings
      - uvx ruff check judge
      - uvx ruff format --check judge
      - uvx ruff check skills/weebo-techdoc
      - uvx ruff format --check skills/weebo-techdoc

  release:
    desc: "Bump the version from conventional commits and tag it (usage: task release; pushes the bump commit and its v* tag, which publishes the binaries)"
    cmds:
      - cog bump --auto

  audit:
    desc: "Check dependencies and Containerfile for CVE"
    cmds:
      - cargo audit
      - task skills:sync:check
      # Python CVEs in judge's locked dependencies; the hashed export lets
      # pip-audit check the exact pins without resolving anything.
      - mkdir -p .task && uv export --project judge --frozen --no-emit-project -o .task/judge-requirements.txt
      - uvx pip-audit --disable-pip -r .task/judge-requirements.txt
      # What the docs site ships (its lockfile; dev tooling left out).
      - npm audit --prefix docs --omit=dev --audit-level=high
      # Supply-chain gate (malware, repo reputation, CVEs); policy in postmortem.conf.
      # Set GITHUB_TOKEN to lift GitHub's 60 req/h anonymous limit.
      - postmortem audit . --online --vulns --no-progress

# Named sets of items to install. Scope is always a CLI argument, never recorded
# here, so one profile serves both `--scope project` and `--scope user`.

[profiles.base]
# wska teaches agents to install skills through wska instead of by hand.
# grilling travels with grill-me: the latter is a three-line shim whose body is
# "call the Skill tool with grilling". ponytail-plugin keeps upstream's
# session-start hook that arms ponytail mode; the vendored skill alone does not.
# weebo-testing is the house test practice; every Weebo project has tests.
items = ["wska", "graphify", "rtk", "ponytail", "ponytail-plugin", "grill-me", "grilling", "weebo-testing"]

[profiles.weebo]
include = ["base"]
# The house practices, each modelled on batlehub (weebo-testing is in base).
# weebo-helm stays out: add it with ITEM= when the project ships a chart.
items = ["weebo-taskfile-mise", "weebo-security", "weebo-containerfile", "weebo-api-contract", "weebo-release", "weebo-cde"]

[profiles.planning]
include = ["base"]
# batlehub-rfc is the house design-document form; bmad plans around it.
# judge brings rfc-ready, the batlehub-rfc review mechanised.
items = ["bmad", "batlehub-rfc", "judge"]

[profiles.design]
include = ["base"]
# These three overlap deliberately — frontend-design and theme-factory are
# references, impeccable is opinionated. Loading all three gives you three
# voices that can disagree; trim to the one you trust per project.
# batlehub-design is the house baseline.
items = ["frontend-design", "theme-factory", "impeccable", "batlehub-design"]

[profiles.frontend]
include = ["design"]
items = ["webapp-testing"]

[profiles.mcp]
include = ["base"]
items = ["mcp-builder", "mlab"]

[profiles.game-design]
# frontend brings the three UI/UX voices plus webapp-testing, which is how a
# browser-run game gets looked at rather than assumed. bmad-gds installs BMGD
# (game dev studio) together with bmm -- so do not add `planning` on top, it
# runs the same installer a second time.
include = ["frontend"]
# Two 3D voices on purpose, like design's three: blender-image-to-3d is a
# gated reference-image-to-game-asset pipeline, 3dviz-pro-max is broader scene
# and Three.js work. Drop whichever one your project does not need.
items = ["bmad-gds", "blender-image-to-3d", "3dviz-pro-max"]

[profiles.review]
include = ["base"]
# judge is the CLI; doc-review the agent `judge doc-review` runs. rfc-ready
# needs no agent, so planning carries judge alone. diff-review is the review
# pane mod (/diff-review).
items = ["judge", "doc-review", "diff-review"]

[profiles.docs]
include = ["base"]
# weebo-techdoc writes docs/techdoc/ for the IDP; pair it with `review` if you
# want doc-review to check changes are documented.
items = ["weebo-techdoc"]

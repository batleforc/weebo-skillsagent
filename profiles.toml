# Named sets of items to install. Scope is always a CLI argument, never recorded
# here, so one profile serves both `--scope project` and `--scope user`.

[profiles.base]
# grilling travels with grill-me: the latter is a three-line shim whose body is
# "call the Skill tool with grilling".
items = ["graphify", "rtk", "ponytail", "grill-me", "grilling"]

[profiles.planning]
include = ["base"]
# batlehub-rfc is the house design-document form; bmad plans around it.
items = ["bmad", "batlehub-rfc"]

[profiles.design]
include = ["base"]
# These three overlap deliberately — frontend-design and theme-factory are
# references, impeccable is opinionated. Loading all three gives you three
# voices that can disagree; trim to the one you trust per project.
# batlehub-design is the house baseline; monofolio-design (a weebo plugin) is
# the portfolio's own system on the same OKLCH palette.
items = ["frontend-design", "theme-factory", "impeccable", "batlehub-design", "monofolio-design"]

[profiles.frontend]
include = ["design"]
items = ["webapp-testing"]

[profiles.mcp]
include = ["base"]
items = ["mcp-builder"]

[profiles.game-design]
# frontend brings the three UI/UX voices plus webapp-testing, which is how a
# browser-run game gets looked at rather than assumed. bmad-gds installs BMGD
# (game dev studio) together with bmm -- so do not add `planning` on top, it
# runs the same installer a second time.
include = ["frontend"]
# Two 3D voices on purpose, like design's three: blender-image-to-3d is a
# gated reference-image-to-game-asset pipeline, 3dviz-pro-max is broader scene
# and Three.js work. Drop whichever one your project does not need.
items = ["bmad-gds", "blender-image-to-3d", "3dviz-pro-max"]

[workspace]
members = ["crates/wska"]
resolver = "3"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tempfile = "3"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# House rules from skills/weebo-good-practice (templates/lints.toml, references/cargo.md).
[workspace.lints.rust]
unsafe_code = "deny"                      # LANG-UNSAFE; "deny", not "forbid": #[expect(unsafe_code, reason)] must stay possible for FFI
unsafe_op_in_unsafe_fn = "deny"           # default in edition 2024, explicit for 2021 crates
let_underscore_drop = "warn"

[workspace.lints.clippy]
# Panics (LANG-LIMIT-PANIC, LANG-LIMIT-PANIC-SRC, LANG-ARRINDEXING). Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Integer overflow (LANG-ARITH): checked_/saturating_/wrapping_ instead of bare operators.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# Errors are handled, never dropped.
let_underscore_must_use = "deny"
let_underscore_future = "deny"
# Memory (MEM-FORGET).
mem_forget = "deny"
# Every escape hatch carries its justification, and dies with the code it excused.
allow_attributes = "deny"                 # #[expect], never #[allow]: an expect with nothing to excuse fails
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"       # LANG-UNSAFE-ENCP: every unsafe {} has a // SAFETY: comment
# Left-over debugging.
dbg_macro = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

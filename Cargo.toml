[workspace]
members = ["crates/wska"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tempfile = "3"

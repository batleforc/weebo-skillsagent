# Provenance for vendored third-party skills, plus installer-based items.
#
# Installer-based items are not vendorable: each writes project-coupled state
# that cannot be symlinked from this repo. bmad renders per-project snapshots
# from an installer-generated _bmad/config.toml that hardcodes the project
# name; graphify is installed by pipx and writes its own skill directory.
#
# [sources.*] record where vendored skills came from; `task skills:sync`
# refreshes them and `task skills:sync:check` reports drift without writing.

[sources.anthropic-skills]
upstream = "https://github.com/anthropics/skills"
ref      = "main"
subpath  = "skills"
# A named list, not "*": the repo also ships docx/pdf/pptx/xlsx/skill-creator/
# claude-api, which this harness already provides as built-ins.
provides = ["mcp-builder", "webapp-testing", "frontend-design", "theme-factory"]
licence  = "Apache-2.0"
commit = "dbd4588"
hashes = { frontend-design = "sha256:b5c2e1f1e14812a1313248313eaed1b17fdf3762607fcb4b9e2ca35501370a06", mcp-builder = "sha256:5bbe358b4bf2efcac08cb86720df4c0abcb6b6a7f05c206229cad35ce2f3130e", theme-factory = "sha256:6b1609671e9da6726637a51427f5552584e0a1cacfcab4a1e8852a195913808b", webapp-testing = "sha256:25ee0d712d267b8b8c5037b2790068cd66b5481ab43c0ba2cba2892b14d9ade9" }

[sources.impeccable]
upstream = "https://github.com/pbakaus/impeccable"
ref      = "main"
# The repo fans the same skill out to ~20 harness directories; .claude/skills
# is the Claude-ready generated form the plugin itself points at. The authored
# source under skill/ holds SKILL.src.md, which is a template, not a skill.
subpath  = ".claude/skills"
provides = ["impeccable"]
# Full text in LICENSES/impeccable.txt: it lives at the repo root upstream, so
# sync (which copies only the subpath) cannot carry it into the skill dir --
# and adding it there by hand would make the local hash diverge from the
# recorded upstream hash, marking the skill as patched forever.
licence  = "Apache-2.0"
commit = "9304afa"
hashes = { impeccable = "sha256:fe36514a563a8e1d42e0edb948e1a5fb7fa705914b0ca7349523dc99bdb7bafc" }

[sources.blender-game-skills]
upstream = "https://github.com/majidmanzarpour/blender-game-skills"
ref      = "main"
subpath  = "skills"
# A named list, not "*": upstream ships one skill today and anything it adds
# later should be a deliberate choice here, not a silent new item.
provides = ["blender-image-to-3d"]
# Full text in LICENSES/blender-game-skills.txt: upstream keeps LICENSE at the
# repo root, outside the synced subpath, so sync cannot carry it into the skill
# dir -- and putting it there by hand would make the local hash diverge from
# the recorded upstream hash, marking the skill as patched forever.
licence  = "MIT"
commit = "f0ef293"
hashes = { blender-image-to-3d = "sha256:816f1c987a8d16c6107d438821f9c8d63cf510a111857099e934563d4e2eb984" }

[sources.3dviz-pro-max]
upstream = "https://github.com/viettranx/3dviz-pro-max"
ref      = "main"
subpath  = "skills"
provides = ["3dviz-pro-max"]
# Full text in LICENSES/3dviz-pro-max.txt, for the same reason as the two
# sources above: LICENSE sits at the repo root, outside the synced subpath.
licence  = "MIT"
commit = "d077e0e"
hashes = { 3dviz-pro-max = "sha256:d0c6a9577d67ef5623214bbd6f962c71006f72cfafc197166b3a0c0d6a843530" }

[sources.ponytail]
upstream = "https://github.com/DietrichGebert/ponytail"
ref      = "main"
subpath  = "skills"
# A named list, not "*": the subpath also holds the plugin's own plugin.json,
# and anything upstream adds later should be a deliberate choice here.
provides = ["ponytail", "ponytail-audit", "ponytail-debt", "ponytail-gain", "ponytail-help", "ponytail-review"]
# Full text in LICENSES/ponytail.txt: LICENSE sits at the repo root, outside
# the synced subpath, like the three sources above.
#
# Upstream ships these skills inside a Claude plugin whose hooks arm ponytail
# mode at session start. Vendoring carries the skills only: ponytail is then
# invoked as a skill, not armed by a hook, and ponytail-gain's benchmark
# numbers (read from the plugin's benchmarks/) are not there to show.
licence  = "MIT"
commit = "09c434a"
hashes = { ponytail = "sha256:c0bd4968ae5f789f6e208df40a57ea3d0abbb66c642677d4d02fb9a62f0ea9ad", ponytail-audit = "sha256:990428458f4dce2bfc6f2fba0124522795b71d0410958154db22a8b6884495ae", ponytail-debt = "sha256:69fd443d41a89d105f4796bba4bad7e04200d4000cc024b8f952dd38c32f885e", ponytail-gain = "sha256:b128a0b9329504626839bcf082f367ebc26518ac9c5afba1dc79df146ca0ba9b", ponytail-help = "sha256:84592d842f52e9fe17a200472293a044ecb5d2a8447bc01f246507891b710683", ponytail-review = "sha256:0fcee427e152792c559f7c45a9f55b68e8c2bba731adaac1ac303d9bc08da98c" }

[sources.mattpocock-skills]
upstream = "https://github.com/mattpocock/skills"
ref      = "main"
# The repo files its skills under category directories; grilling and its
# trigger shim both live in productivity/.
subpath  = "skills/productivity"
# grill-me is a three-line shim whose whole body is "call the Skill tool with
# grilling", so the two travel together or neither works.
provides = ["grill-me", "grilling"]
# Full text in LICENSES/mattpocock-skills.txt, same root-LICENSE reason.
licence  = "MIT"
commit = "49dd158"
hashes = { grill-me = "sha256:a2253d86abb930490613ecd40db7166d53451c0ae03271f4acce36fdf47c5ef3", grilling = "sha256:9fd4deb13b57d10876a782f9a6aa4adb47587be511231a0763835d35c7de6034" }

[sources.skill-nr]
upstream = "https://github.com/Institut-du-Numerique-Responsable/skill-nr"
ref      = "main"
# Not laid out as skills: rules and agents generated per assistant. `copies`
# lifts the eco-design rules and their criteria into weebo-good-practice, and
# the Claude Code agents (eco-check, accessibilite-check) into one agent item.
# Never edit the copies (share-alike, and sync would see them as patched).

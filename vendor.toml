# Full text in LICENSES/skill-nr.txt: LICENSE sits at the repo root.
licence  = "CC-BY-SA-4.0"
commit = "2466e75"
hashes = { "agents/nr-check" = "sha256:0d91ac89ce7ca19dc5768fb3b62f516e16808bcd4ce65cd6b9e5b02c444fec82", "skills/weebo-good-practice/references/nr/referentiels" = "sha256:bddcd052ee8bb6a24426cafab3c696bba01b58adb594baf140f0ef88d6884114", "skills/weebo-good-practice/references/nr/rules" = "sha256:771b967b89fa539d0a79553780a902e72696b76aa9850d88ebc21d6791b573fa" }

# skills/batlehub-design is a hand-made snapshot, not a [sources] entry:
# upstream (https://github.com/batlehub/batlehub, Apache-2.0, commit 2336695)
# keeps its design system as loose files rather than a skill directory, so sync
# has nothing to copy. Copied verbatim: DESIGN.md, docs/.vitepress/theme/
# tokens.css -> tokens.css, ui/design-proof/ -> reference/. SKILL.md is ours.
# Refresh by re-copying those paths and bumping the commit here and in
# SKILL.md. Licence text in LICENSES/batlehub.txt.
#
# skills/weebo-* are ours; their templates/ are trimmed copies of batlehub
# files at commit 20879e5, each naming its source in a header. Refresh by
# re-reading those files upstream and bumping the commit in the headers.
#
# references/rust.md in skills/weebo-good-practice is ours, derived from
# ANSSI-FR/rust-guide at commit 3f9e2e2.
#
# skills/batlehub-rfc is ours, derived (not copied) from the same commit's
# .claude/skills/rfc and docs/internal/0000-rfc-template.md: made portable to
# any repo, and extended with mandatory security, supply-chain, privacy and
# operability blocks. Re-read upstream's two files when refreshing the design
# snapshot, and port what changed by hand.

# External commands each item needs. Hand-maintained: wska reads this, it does
# not infer requirements, so an upstream that starts shelling out to something
# new goes unnoticed until this table is updated. Alternatives separated by `|`
# are satisfied when any one resolves, which is how one entry covers a
# Chrome-ish browser across distributions.
[requires]
graphify        = ["graphify"]
rtk             = ["rtk"]
bmad            = ["npx", "uv"]
mcp-builder     = ["python3", "npx"]
# py:<module> is an import check, not a PATH lookup: webapp-testing drives
# Playwright as a Python library. Install it into the python3 on PATH with
# `pip install playwright`, then `playwright install chromium` for the browser
# binaries -- which doctor cannot see, so a green row here is necessary and not
# sufficient.
webapp-testing  = ["python3", "py:playwright"]
frontend-design = ["google-chrome|chromium|chrome"]
# `blender` must be on PATH for doctor to see it; the skill itself also accepts
# $BLENDER_BIN or the macOS app path, which no PATH lookup can prove. py:PIL is
# Pillow, which compose_review.py needs for the compare sheets every phase gate
# is read from.
blender-image-to-3d = ["blender", "python3", "py:PIL"]
# node drives the Three.js half; Blender is optional for this one (without it
# the skill stays on Three.js-only construction), so it is not required here.
# The last entry is "inspect the output somehow": automated capture through
# Playwright, or a visible browser.
3dviz-pro-max = ["python3", "node", "py:playwright|google-chrome|chromium|chrome"]
impeccable      = ["node", "npx", "google-chrome|chromium|chrome"]
ponytail-plugin = ["claude", "node"]
mlab            = ["claude"]
# gh only for the pull-request views; uncommitted/commits work with git alone.
diff-review     = ["claude", "git", "gh"]
judge           = ["uv"]
weebo-techdoc   = ["python3", "git"]
# cargo-fuzz and k6 serve conditional layers, but are listed so a red row
# says what is missing before the skill asks for it.
weebo-testing   = ["cargo", "cargo-llvm-cov", "cargo-fuzz", "k6"]
# Only what the skill's own local tasks run; the CI-only scanners, signers and
# image builders (semgrep, cosign, buildx, ...) run in GitHub Actions. That is
# also why weebo-containerfile has no row: no container engine in a CDE.
weebo-taskfile-mise = ["task", "mise", "cog", "gitleaks", "git"]
weebo-security      = ["cargo-audit", "cargo-deny", "pnpm", "trivy"]
weebo-deps          = ["cargo", "cargo-machete", "cargo-audit", "pnpm", "jq", "mise"]
weebo-api-contract  = ["cargo", "pnpm", "npx"]
weebo-release       = ["cog", "git", "task"]
weebo-cde           = ["kubectl", "task"]
weebo-helm          = ["helm", "helm-docs"]
wska            = ["wska|cargo"]
doc-review      = ["claude", "judge"]

# Gemini CLI / Antigravity: `--tools` is the whole IDE list, not an addition
# to it -- naming only gemini deletes the claude-code skills of an existing
# install. So the command re-reads the IDEs from bmad's manifest and appends its
# own. --action update installs fresh too; --yes keeps it unattended and keeps
# an existing install's settings (a fresh one gets the defaults).
#
# `update` is what `wska update` runs instead of `command`; absent, it re-runs
# `command`. bmad's plain install is interactive, so its update is the
# unattended `--action update` the other agents already use.
[installers.bmad]
command = "npx bmad-method install"
update  = "npx bmad-method install --yes --action update"
scope   = "project"
gemini      = { scope = "project", command = '''ides=$(sed -n '/^ides:/,/^[^ ]/s/^  - //p' _bmad/_config/manifest.yaml 2>/dev/null | grep -vx gemini | paste -sd, -); npx bmad-method install --yes --action update --tools "${ides:+$ides,}gemini"''' }
antigravity = { scope = "project", command = '''ides=$(sed -n '/^ides:/,/^[^ ]/s/^  - //p' _bmad/_config/manifest.yaml 2>/dev/null | grep -vx antigravity | paste -sd, -); npx bmad-method install --yes --action update --tools "${ides:+$ides,}antigravity"''' }

[installers.graphify]
# Also ignores graphify-out/cache/, which `graphify update` rebuilds locally;
# the grep keeps a re-install from adding the line twice.
command = 'graphify install --project --platform claude && (grep -qxF "graphify-out/cache/" .gitignore 2>/dev/null || printf "\n%s\n" "graphify-out/cache/" >> .gitignore)'
scope   = "project"
gemini      = { scope = "project", command = 'graphify install --project --platform gemini && (grep -qxF "graphify-out/cache/" .gitignore 2>/dev/null || printf "\n%s\n" "graphify-out/cache/" >> .gitignore)' }
antigravity = { scope = "project", command = 'graphify install --project --platform antigravity && (grep -qxF "graphify-out/cache/" .gitignore 2>/dev/null || printf "\n%s\n" "graphify-out/cache/" >> .gitignore)' }

# BMGD, the game dev studio module (installer code `gds`). Its own item because
# the bmad installer treats `--modules` as the whole install rather than an
# addition to it: naming only gds would drop bmm from _bmad, so this command
# names both. Don't install `bmad` and `bmad-gds` together -- same installer,
# run twice.
[installers.bmad-gds]
command = "npx bmad-method install --modules bmm,gds"
update  = "npx bmad-method install --yes --action update --modules bmm,gds"
scope   = "project"
gemini      = { scope = "project", command = '''ides=$(sed -n '/^ides:/,/^[^ ]/s/^  - //p' _bmad/_config/manifest.yaml 2>/dev/null | grep -vx gemini | paste -sd, -); npx bmad-method install --yes --action update --modules bmm,gds --tools "${ides:+$ides,}gemini"''' }
antigravity = { scope = "project", command = '''ides=$(sed -n '/^ides:/,/^[^ ]/s/^  - //p' _bmad/_config/manifest.yaml 2>/dev/null | grep -vx antigravity | paste -sd, -); npx bmad-method install --yes --action update --modules bmm,gds --tools "${ides:+$ides,}antigravity"''' }

# `rtk init` writes RTK.md into the target and patches .claude/settings.json
# with rtk's hooks. --auto-patch is what keeps it unattended: without it the
# settings.json step prompts, and an install run from a task would hang.
# rtk sets Gemini CLI up globally only (~/.gemini hooks + GEMINI.md), so that
# variant needs `--scope user`; Antigravity gets a project plugin in .agents/.
[installers.rtk]
command = "rtk init --auto-patch"
scope   = "project"
gemini      = { scope = "user", command = "rtk init -g --gemini --auto-patch" }
antigravity = { scope = "project", command = "rtk init --agent antigravity --auto-patch" }

# Ponytail as upstream ships it: the plugin, whose SessionStart hook arms
# ponytail mode in every session, which the vendored `ponytail` skill cannot do.
# Its skills come namespaced (ponytail:*), so it can sit beside the vendored ones.
# Gemini CLI gets upstream's extension (always-on ruleset + /ponytail commands,
# no hooks), user-wide only; install refuses one already there, hence uninstall
# first. Antigravity gets upstream's plugin (skills only); untested here, no `agy`.
# Re-installing a plugin does not move it: update refreshes the marketplace
# catalog, then the plugin.
[installers.ponytail-plugin]
command = "claude plugin marketplace add DietrichGebert/ponytail --scope project; claude plugin install ponytail@ponytail --scope project"
update  = "claude plugin marketplace update ponytail; claude plugin update ponytail@ponytail --scope project"
scope   = "project"
gemini      = { scope = "user", command = "gemini extensions uninstall ponytail 2>/dev/null; gemini extensions install https://github.com/DietrichGebert/ponytail --consent", update = "gemini extensions update ponytail" }
antigravity = { scope = "user", command = "agy plugin install https://github.com/DietrichGebert/ponytail" }

# A Claude Code mod (nicolas-codemate/claude-code-mods, MIT): mods ship as
# plugins, so a mod is an installer like ponytail-plugin. diff-review is the
# /diff-review pane: uncommitted, PR and per-commit diffs, ask Claude per line.
[installers.diff-review]
command = "claude plugin marketplace add nicolas-codemate/claude-code-mods --scope project; claude plugin install diff-review@codemate-mods --scope project"
update  = "claude plugin marketplace update codemate-mods; claude plugin update diff-review@codemate-mods --scope project"
scope   = "project"

# mlab.sh's remote MCP server (https://github.com/mlab-sh/mcp, MIT listing,
# closed server), written into the target's .mcp.json (.gemini/settings.json
# for Gemini CLI). OAuth, so no token lands in the repo: run /mcp once to sign
# in. remove-then-add because `claude mcp add` fails on a name that already
# exists, which would break reruns. No Antigravity setup: it has no `mcp add`.
[installers.mlab]
command = "claude mcp remove mlab --scope project; claude mcp add --transport http --scope project mlab https://mlab.sh/mcp"
scope   = "project"
gemini  = { scope = "project", command = "gemini mcp remove mlab --scope project; gemini mcp add --transport http --scope project mlab https://mlab.sh/mcp" }

# The judge CLI (rfc-ready, doc-review), installed machine-wide by uv. scope
# "any": the review profile is usually installed with --scope project, where a
# user-scoped installer would be skipped, leaving doc-review linked but unable
# to run. --editable mirrors the symlink model: edits here are live everywhere.
[installers.judge]
command = 'uv tool install --force --editable "$WSKA_REPO/judge"'
scope   = "any"

# Skills fetched from a git repo at install time, never committed here. Cloned
# into .task/wska-cache/external/<name> and linked like a vendored skill;
# `task skills:sync` re-clones. Not hash-tracked, so review upstream yourself.
#
# [external.<item>]
# upstream = "https://github.com/batlehub/batlehub"
# ref      = "main"                 # branch or tag
# path     = ".claude/skills/rfc"   # the skill directory inside the repo
# licence  = "Apache-2.0"
